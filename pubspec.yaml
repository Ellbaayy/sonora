name: sonora
description: "Pemutar musik dan video lokal offline-first untuk Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audio_metadata_reader: ^1.8.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.0
  uuid: ^4.6.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
